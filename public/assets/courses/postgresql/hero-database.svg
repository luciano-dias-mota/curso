<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" role="img" aria-labelledby="title desc">
<title id="title">PostgreSQL e banco de dados</title>
<desc id="desc">Ilustração tecnológica com elefante, banco de dados, código SQL e circuitos.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#dff4ff"/>
    <stop offset=".52" stop-color="#8ed4f5"/>
    <stop offset="1" stop-color="#1784c8"/>
  </linearGradient>
  <linearGradient id="db" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#dff7ff"/>
    <stop offset=".28" stop-color="#64c5f4"/>
    <stop offset=".75" stop-color="#0673b5"/>
    <stop offset="1" stop-color="#034a83"/>
  </linearGradient>
  <linearGradient id="dbTop" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#ffffff"/>
    <stop offset=".42" stop-color="#86d9ff"/>
    <stop offset="1" stop-color="#0c8ed1"/>
  </linearGradient>
  <filter id="shadow" x="-40%" y="-40%" width="180%" height="180%">
    <feDropShadow dx="0" dy="16" stdDeviation="16" flood-color="#074d86" flood-opacity=".22"/>
  </filter>
  <filter id="glow" x="-100%" y="-100%" width="300%" height="300%">
    <feGaussianBlur stdDeviation="4" result="b"/>
    <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
</defs>

<rect width="900" height="420" fill="url(#bg)"/>
<g opacity=".22" stroke="#ffffff" stroke-width="2" fill="none">
  <path d="M0 92h98l40 38h116l42-38h110"/>
  <path d="M36 338h115l50-48h96l48 42h126"/>
  <path d="M420 22v62l55 45h99l42-32h128"/>
  <path d="M688 14v74l42 39h170"/>
  <path d="M515 395v-58l54-45h86"/>
  <circle cx="98" cy="92" r="5" fill="#fff"/>
  <circle cx="254" cy="130" r="5" fill="#fff"/>
  <circle cx="406" cy="92" r="5" fill="#fff"/>
  <circle cx="574" cy="129" r="5" fill="#fff"/>
  <circle cx="730" cy="127" r="5" fill="#fff"/>
  <circle cx="201" cy="290" r="5" fill="#fff"/>
  <circle cx="345" cy="332" r="5" fill="#fff"/>
  <circle cx="655" cy="292" r="5" fill="#fff"/>
</g>

<g opacity=".16">
  <circle cx="758" cy="72" r="178" fill="none" stroke="#fff" stroke-width="1.5"/>
  <circle cx="758" cy="72" r="145" fill="none" stroke="#fff" stroke-width="1.5"/>
  <circle cx="758" cy="72" r="112" fill="none" stroke="#fff" stroke-width="1.5"/>
</g>

<!-- generic elephant / PostgreSQL cue -->
<g transform="translate(335 38)" filter="url(#shadow)">
  <path d="M109 30
           C77 7 30 16 18 51
           C6 86 27 124 59 130
           C63 161 82 181 109 179
           C126 178 138 167 139 151
           C140 137 134 126 124 115
           C140 116 156 107 162 92
           C171 70 162 46 144 34
           C132 26 120 24 109 30Z"
        fill="#0b70b7" stroke="#08335e" stroke-width="8"/>
  <path d="M61 62
           C63 45 78 35 97 36
           C116 36 129 49 130 67
           C131 86 119 98 104 101
           L104 135
           C104 151 94 160 82 157
           C71 154 67 145 70 134
           L75 105
           C58 100 49 84 52 69Z"
        fill="#dff7ff" stroke="#ffffff" stroke-width="5"/>
  <path d="M92 47c9 0 18 8 18 18s-8 18-18 18c-10 0-18-8-18-18s8-18 18-18Z"
        fill="#0b70b7"/>
  <circle cx="94" cy="64" r="4.5" fill="#fff"/>
  <path d="M127 70c13 1 23 9 24 20" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round"/>
</g>
<text x="355" y="238" font-family="Inter,Arial,sans-serif" font-size="34" fill="#08345f" opacity=".92">PostgreSQL</text>

<!-- SQL card -->
<g transform="translate(650 48) rotate(3)" filter="url(#shadow)">
  <rect width="205" height="132" rx="18" fill="#07588e" fill-opacity=".82" stroke="#c8efff" stroke-width="2"/>
  <text x="22" y="31" font-family="Consolas,monospace" font-size="17" fill="#b9eeff">SELECT *</text>
  <text x="22" y="56" font-family="Consolas,monospace" font-size="17" fill="#ffffff">FROM produtos</text>
  <text x="22" y="81" font-family="Consolas,monospace" font-size="17" fill="#ffffff">WHERE estoque &gt; 0</text>
  <text x="22" y="106" font-family="Consolas,monospace" font-size="17" fill="#ffffff">ORDER BY nome;</text>
</g>

<!-- database cylinder -->
<g transform="translate(530 150)" filter="url(#shadow)">
  <ellipse cx="110" cy="36" rx="100" ry="34" fill="url(#dbTop)" stroke="#e8fbff" stroke-width="3"/>
  <path d="M10 36v70c0 20 45 36 100 36s100-16 100-36V36"
        fill="url(#db)" stroke="#8bdcff" stroke-width="2"/>
  <ellipse cx="110" cy="106" rx="100" ry="36" fill="#0878b9" stroke="#7bd4fb" stroke-width="2"/>
  <path d="M10 106v67c0 20 45 36 100 36s100-16 100-36v-67"
        fill="url(#db)" stroke="#8bdcff" stroke-width="2"/>
  <ellipse cx="110" cy="173" rx="100" ry="36" fill="#0a77b5" stroke="#8bdcff" stroke-width="2"/>
  <path d="M10 173v58c0 20 45 36 100 36s100-16 100-36v-58"
        fill="url(#db)" stroke="#8bdcff" stroke-width="2"/>
  <ellipse cx="110" cy="231" rx="100" ry="36" fill="#b8eaff" stroke="#ecfbff" stroke-width="3"/>
  <circle cx="181" cy="91" r="5" fill="#67ddff" filter="url(#glow)"/>
  <circle cx="181" cy="159" r="5" fill="#67ddff" filter="url(#glow)"/>
  <circle cx="181" cy="219" r="5" fill="#67ddff" filter="url(#glow)"/>
</g>

<!-- table card -->
<g transform="translate(760 205)" filter="url(#shadow)">
  <rect width="120" height="88" rx="14" fill="#dff6ff" fill-opacity=".72" stroke="#ffffff" stroke-width="2"/>
  <g fill="#248fd0">
    <rect x="17" y="19" width="86" height="10" rx="3"/>
    <rect x="17" y="39" width="28" height="10" rx="3"/>
    <rect x="53" y="39" width="50" height="10" rx="3"/>
    <rect x="17" y="59" width="42" height="10" rx="3"/>
    <rect x="67" y="59" width="36" height="10" rx="3"/>
  </g>
</g>

<!-- chart card -->
<g transform="translate(785 308)" filter="url(#shadow)">
  <rect width="100" height="76" rx="14" fill="#dff6ff" fill-opacity=".72" stroke="#ffffff" stroke-width="2"/>
  <g fill="#167fc2">
    <rect x="19" y="44" width="12" height="18" rx="2"/>
    <rect x="39" y="30" width="12" height="32" rx="2"/>
    <rect x="59" y="20" width="12" height="42" rx="2"/>
  </g>
</g>

<!-- small table icon -->
<g transform="translate(405 285)" filter="url(#shadow)">
  <rect width="82" height="72" rx="13" fill="#dff6ff" fill-opacity=".72" stroke="#ffffff" stroke-width="2"/>
  <g stroke="#1680c3" stroke-width="4">
    <path d="M17 18h48M17 34h48M17 50h48"/>
    <path d="M32 18v32M49 18v32"/>
  </g>
</g>
</svg>