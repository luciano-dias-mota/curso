name: PHP Syntax Check

on:
  push:
    branches:
      - main
      - feature/multi-course-platform
  pull_request:

permissions:
  contents: read

jobs:
  php-lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP 8.3
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none

      - name: Validate PHP syntax
        shell: bash
        run: |
          find app config routes database public -name '*.php' -print0 \
            | xargs -0 -n1 php -l
